# Remote-control bindings. These use the standard media-key names, so they
# work for most air-mouse/HTPC remotes, not just the MX3 Pro they were
# mapped from (button -> key table in modules/hardware/input.nix).
# Arrows, Enter, PgUp/PgDn (chapters) and Backspace (reset speed) keep
# mpv's defaults. Volume and mute are left to the desktop's system volume.

# Back: close the menu/track list if one is open, otherwise leave the
# player (back to Stremio etc.), remembering the position. scripts/remote_back.lua
GO_BACK      script-binding remote_back/back

# Under Plasma, play/pause/next/previous are global shortcuts sent to the
# active MPRIS player, so mpv sees them through the mpris script (added in
# modules/media/mpv.nix), not through these bindings. Kept for desktops
# that pass the keys to the focused window.
PLAYPAUSE    cycle pause
REWIND       seek -10
FORWARD      seek 30
PREV         playlist-prev
NEXT         playlist-next

# "List" button: mpv's built-in menu (tracks, chapters, playlist, ...)
MENU         script-binding select/menu
# "Movies" button: anime <-> live-action shader profile (same as `a`). The
# text it shows in the corner confirms which profile is now active
TOOLS        script-binding auto_upscaler/toggle-anime
# "!" button: subtitle list. Internet Explorer button: audio track list.
# Pick with the arrows and OK, close with Back. The audio list opens even for
# a single track (the List menu hides "Audio tracks" when there's only one)
MAIL         script-binding select/select-sid
WWW          script-binding select/select-aid
# Search button: stats overlay (dropped frames, shaders, HDR info)
SEARCH       script-binding stats/display-stats-toggle

ZOOMIN       add video-zoom 0.1
ZOOMOUT      add video-zoom -0.1

# Number keys jump to 0-90% through the video. mpv's defaults put contrast,
# brightness, gamma and saturation on 1-8, which a remote's number pad
# changes by accident.
0 seek  0 absolute-percent
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent
