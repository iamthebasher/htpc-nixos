##### GLOBAL SETTINGS #####

vo=gpu-next
gpu-api=vulkan
hwdec=nvdec
fullscreen=yes
log-file=/tmp/mpv.log
msg-level=all=warn
osc=no

hr-seek-framedrop=no

demuxer-readahead-secs=20
vd-lavc-threads=8

# Subtitles
slang=en
sub-auto=fuzzy
subs-with-matching-audio=no
sub-ass-override=force
sub-font=Roboto
sub-font-size=48
sub-color=1.0/1.0/0.0/1.0
sub-border-color=0.0/0.0/0.0/1.0
sub-border-size=3
sub-shadow-offset=1
sub-shadow-color=0.0/0.0/0.0/0.5
sub-bold=yes

# Scaling (Global Defaults - Optimized for Live-Action transparency)
scale=ewa_lanczossharp
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"
dscale=mitchell
dither-depth=auto

# Debanding (Global Defaults)
deband=yes
deband-iterations=2
deband-threshold=48
deband-range=16

# Streaming cache
cache=yes
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=75MiB

# Network streams (moved here from the old mpv-stremio wrapper so every
# source gets them — Stremio, IPTV, YouTube, Jellyfin, OTA all stream)
load-unsafe-playlists=yes
network-timeout=10
force-window=immediate
cache-secs=30
cache-pause-initial=yes
cache-pause-wait=20
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5,reconnect_on_http_error=429

# Audio
audio-normalize-downmix=yes
audio-channels=stereo

# Screenshots
screenshot-format=png
screenshot-png-compression=4
screenshot-directory=~/Pictures/mpv

# YouTube profile (applied automatically via profile-cond)
[youtube]
profile-cond=string.find(p.path or "", "youtube") ~= nil
profile-restore=copy
ytdl-format=bestvideo[height<=2160]+bestaudio/best[height<=2160]
deband-iterations=4
deband-threshold=48
deband-range=16

##### LIVE-ACTION PROFILES (Default - Math Based) #####

[upscale_480]
glsl-shaders-clr=""
scale=ewa_lanczossharp
glsl-shaders-append="~~/shaders/KrigBilateral.glsl"
# To try FSR instead, comment out the two lines above and uncomment these:
# glsl-shaders="~~/shaders/FSR_EASU.glsl:~~/shaders/FSR_RCAS.glsl"
video-sync=display-resample
interpolation=yes
interpolation-threshold=-1
tscale=oversample
target-colorspace-hint=yes
dither=fruit
fbo-format=rgba16f

